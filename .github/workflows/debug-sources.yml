name: Kaynak incelemesi (geçici)

on:
  push:
    branches: [main]
    paths: ['scripts/debug-sources.mjs', '.github/workflows/debug-sources.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/debug-sources.mjs
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug
          git commit -m "Kaynak örnekleri [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
