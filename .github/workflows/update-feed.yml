name: Oran ve sonuç güncellemesi

# Saatte bir: iddaa'dan Şampiyonlar Ligi oranları, ESPN'den sonuçlar.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update-feed.mjs', '.github/workflows/update-feed.yml']

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Güncelle
        run: node scripts/update-feed.mjs
      - name: Doğrula
        run: node scripts/check-feed.mjs
      - name: Kaydet
        run: |
          if [ -n "$(git status --porcelain data/feed.json data/update-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/feed.json data/update-status.json
            git commit -m "Bülten güncellendi [skip ci]"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
