name: Güvenlik kuralları testi

on:
  push:
    branches: [main]
    paths: ['scripts/rules-test.mjs', '.github/workflows/rules-test.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: scripts
        run: npm install --no-audit --no-fund --loglevel=error
      - run: node scripts/rules-test.mjs
      - name: Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rules-test.json
          git commit -m "Kural testi sonucu [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
