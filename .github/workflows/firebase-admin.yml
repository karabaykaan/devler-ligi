name: Firebase yönetimi

# Kurallar değişince yayınlar; her 5 dakikada bekleyen şifre sıfırlamalarını uygular.
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'scripts/**', '.github/workflows/firebase-admin.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        working-directory: scripts
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Çalıştır
        env:
          DEPLOY_RULES: ${{ github.event_name != 'schedule' }}
        run: node scripts/admin.mjs
      - name: Durumu kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/admin-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/admin-status.json
            git commit -m "Yönetim durumu güncellendi [skip ci]"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
